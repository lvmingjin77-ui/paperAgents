[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperagents"
version = "0.2.0"
description = "Problem-driven research: expert ideas, experiments, evidence and manuscripts"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["jsonschema>=4.23,<5", "matplotlib>=3.8,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.urls]
Repository = "https://github.com/lvmingjin77-ui/paperAgents"

[project.scripts]
paperagents = "paperagents.cli:main"

[tool.setuptools]
packages = ["paperagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", ".venv", ".venv-rebuild", "projects"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

[tool.setuptools.package-data]
paperagents = ["web.html"]
