<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaperAgents · 研究工作台</title>
<style>
:root{font:15px/1.6 system-ui,-apple-system,sans-serif;color:#182329;background:#f5f6f4;--line:#dce2dc;--accent:#216653}*{box-sizing:border-box}body{margin:0}header{height:75px;display:flex;align-items:center;gap:20px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}h1{font-size:21px;margin:0;letter-spacing:-.5px}header small{color:#7b867e}select,input,button{font:inherit;border:1px solid var(--line);border-radius:7px;background:#fff;padding:7px 10px}button{cursor:pointer;color:var(--accent)}button:hover{background:#edf4ef}.status{font-size:13px;border-radius:20px;background:#e6f0e8;padding:4px 12px;overflow-wrap:anywhere}header label{margin-left:auto;white-space:nowrap}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 75px)}aside{padding:22px 16px;border-right:1px solid var(--line);position:sticky;top:75px;height:calc(100vh - 75px);overflow:auto;background:#fbfcfa}aside button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;margin:3px 0}aside button.active{background:#e4ede6;color:#144a3c;font-weight:600}aside small{display:block;color:#78867e;padding:8px 12px}main{padding:24px 32px;min-width:0;max-width:1600px;width:100%}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.toolbar h2{font-size:22px;margin:0}#query{width:240px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 22px;margin:0 0 14px;overflow-wrap:anywhere}.card h3{font-size:16px;margin:0 0 8px}.meta{display:flex;gap:12px;flex-wrap:wrap;color:#6d7a71;font-size:13px;margin-bottom:10px}.pill{background:#eef2ee;border-radius:4px;padding:1px 7px;color:#365342}pre{font:13px/1.6 ui-monospace,SFMono-Regular,monospace;white-space:pre-wrap;word-break:break-word;background:#f7f9f7;border-radius:6px;padding:12px;max-height:600px;overflow:auto;margin:8px 0}details{margin:7px 0}summary{cursor:pointer;color:#3f5f4e;padding:3px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.number{font-size:30px;font-weight:600;color:#205b47}.empty{padding:60px 10px;color:#7c877e;text-align:center}.error{color:#a03630;background:#fff0ed;border-color:#edc9c1}.kv{display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:8px;border-bottom:1px solid #eef1ec;padding:5px 0}.kv>span:first-child{color:#728076;font-size:13px}.kv>div{min-width:0}a{color:#216653}svg{max-width:100%;height:auto}svg text{font:12px system-ui;fill:#364b3c}footer{font-size:12px;color:#889388;padding:10px 0}.log-item{border-left:2px solid #dbe5db;padding-left:10px}.badge-failed,.badge-refuted{color:#a03630;background:#fbece8}.badge-supported,.badge-completed{color:#216653;background:#e3f0e8}.event{display:grid;grid-template-columns:180px 1fr;gap:15px;margin:9px 0}.hint{color:#7c877e;font-size:13px}.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.mono{font-family:ui-monospace,monospace;font-size:13px}@media(max-width:800px){header{height:auto;min-height:70px;flex-wrap:wrap;padding:12px;gap:8px}.layout{grid-template-columns:1fr}aside{position:static;height:auto;display:flex;overflow:auto;padding:6px}aside button{white-space:nowrap;width:auto}aside small{display:none}main{padding:18px 12px}.event{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}#query{width:100%}}
</style>
<header><div><h1>PaperAgents</h1><small>研究过程与证据</small></div><select id="runSelect" aria-label="研究运行"></select><span id="status" class="status">正在读取</span><label><input id="live" type="checkbox" checked> 实时刷新</label></header>
<div class="layout"><aside id="nav"></aside><main><div class="toolbar"><h2 id="heading">研究概览</h2><input id="query" aria-label="筛选当前视图" placeholder="筛选当前视图…"></div><div id="notice"></div><div id="content"></div><footer>仅查看。页面刷新不会启动任务或改变研究状态；时间显示为北京时间。</footer></main></div>
<script>
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs={overview:'研究概览',pool:'对话池',tasks:'任务与 Agent',claims:'主张与谱系',evidence:'证据与六维评分',runs:'实验运行',draft:'论文草稿',experts:'专家',domain:'领域图谱',errors:'错误',events:'时间线'};
const labels={knowledge:'知识准备',scope:'范围',corpus:'文献库',reading:'阅读卡',domain:'领域理解',selection:'选队',paper:'论文专家',consultant:'临时专家',expert_review:'专家审核',propose:'独立提案',exchange:'交叉意见',revise:'作者修订',triage:'去重',merge:'合并',assess:'可检验性评估',select:'实验组合',build_testbed:'评测底座',protocol_review:'协议审核',build:'实现方法',implementation_review:'实现审核',judge:'结果判定',explain:'解释结果',evolve:'修订进化',novelty:'查新',ablation_plan:'消融计划',freeze:'冻结',write:'写作',peer_review:'论文评审',meta_review:'综合评审',completed:'完成',running:'运行中',pending:'待处理',awaiting_workers:'等待任务',awaiting_execution:'等待实验授权',awaiting_confirmation:'等待确认',needs_evidence:'需要证据',failed:'失败',supported:'有证据支持',refuted:'被反驳',inconclusive:'尚不确定',untested:'未验证',unverifiable_with_resources:'当前资源无法验证',budget_exhausted:'预算内未完成',impl_failed:'实现失败',protocol_failed:'协议无效',screen:'开发子集',confirm:'开发全集',test:'最终测试'};
Object.assign(labels,{testbed_plan:'底座设计',write_section:'专家章节',rebuttal:'评审回应',final_judgment:'最终结果判读',paused:'已暂停',ready:'就绪',needs_human:'需要处理',needs_materials:'需要材料',needs_latex:'等待编译环境',ready_for_experiment:'等待执行实验',needs_protocol_revision:'需要修订协议',testbed:'评测底座',final_test:'最终测试',finalize:'定稿',compile:'编译',draft:'论文草稿',outline:'写作提纲',compilation:'编译结果',frozen:'冻结记录',phase:'阶段',status:'状态',reason:'原因',summary:'摘要',comments:'意见',metrics:'指标',budget:'预算',checkpoints:'检查点',parents:'来源版本',evidence_ids:'证据编号',problem_value:'问题价值',novelty:'新颖性',mechanism_soundness:'机制合理性',evidence_quality:'证据质量',experimental_discriminability:'实验判别力',feasibility:'实施可行性'});
let runId=localStorage.getItem('pa-run')||'',tab=localStorage.getItem('pa-tab')||'overview',state={},pool=[],events=[],errors=[],busy=false,selectedTask='',detail=null,preview=null,folds=new Map(),scrolls=new Map(),pageSize=200,lastRender='';
if(!(tab in tabs))tab='overview';
const label=x=>labels[x]||x||'—',fmt=x=>{if(!x)return '—';const d=new Date(x);return isNaN(d)?esc(x):new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'short',timeStyle:'medium',hour12:false}).format(d)},pill=x=>`<span class="pill badge-${esc(x)}">${esc(label(x))}</span>`;
async function api(path,args={}){const q=new URLSearchParams({...args,...(runId?{run:runId}:{})});const r=await fetch('/api/'+path+'?'+q);const value=await r.json();if(!r.ok)throw Error(value.error||r.status);return value}
function json(v,key='root',depth=0){if(v==null)return '<span class="hint">—</span>';if(typeof v!=='object')return typeof v==='string'&&v.startsWith('/')?`<button data-file="${esc(v)}" title="查看本地产物">${esc(v)}</button>`:`<span>${esc(v)}</span>`;if(depth>5)return `<pre data-scroll-key="${esc(key)}">${esc(JSON.stringify(v,null,2))}</pre>`;return Object.entries(v).map(([k,x])=>{const id=key+'.'+k;return typeof x==='object'&&x!==null?`<details data-key="${esc(id)}"><summary>${esc(label(k))} ${Array.isArray(x)?`(${x.length})`:''}</summary><div>${json(x,id,depth+1)}</div></details>`:`<div class="kv"><span>${esc(label(k))}</span><div>${json(x,id,depth+1)}</div></div>`}).join('')}
function card(title,body,meta='',id=''){return `<article class="card" data-card="${esc(id)}"><h3>${esc(title)}</h3>${meta?`<div class="meta">${meta}</div>`:''}${body}</article>`}
function objects(data,key,render){return Object.entries(data||{}).map(([id,x])=>render(id,x)).join('')||'<div class="empty">此阶段尚无产物</div>'}
function graph(nodes,edges){if(!nodes.length)return '<div class="empty">尚无图谱</div>';const width=1000,h=Math.max(160,Math.ceil(nodes.length/4)*120),positions=Object.fromEntries(nodes.map((n,i)=>[n.id,{x:130+(i%4)*245,y:60+Math.floor(i/4)*120}]));return `<svg viewBox="0 0 ${width} ${h}" role="img" aria-label="关系图">${edges.filter(e=>positions[e[0]]&&positions[e[1]]).map(([a,b])=>`<line x1="${positions[a].x}" y1="${positions[a].y}" x2="${positions[b].x}" y2="${positions[b].y}" stroke="#bccdbd"/>`).join('')}${nodes.map(n=>`<g><circle cx="${positions[n.id].x}" cy="${positions[n.id].y}" r="17" fill="#c8ded0"/><title>${esc(n.title||n.id)}</title><text x="${positions[n.id].x}" y="${positions[n.id].y+35}" text-anchor="middle">${esc(String(n.title||n.id).slice(0,28))}</text></g>`).join('')}</svg>`}
function transcript(attempt){const entries=attempt.transcript||[];return `<details data-key="log-${esc(attempt.name)}"><summary>Agent 过程 · ${esc(attempt.name)} · ${entries.length} 条有效记录</summary>${entries.slice(-pageSize).map(e=>`<div class="log-item"><details data-key="line-${esc(attempt.name)}-${e.log_line}"><summary>${e.log_line} · ${esc(e.type||'记录')} ${esc(e.message?.content?.find?.(b=>b.type==='tool_use')?.name||'')}</summary>${json(e,'log.'+attempt.name+'.'+e.log_line)}</details></div>`).join('')}${entries.length>pageSize?'<button data-action="more">显示更多历史记录</button>':''}</details>`}
function render(){const signature=JSON.stringify([tab,state,pool,events,errors,selectedTask,detail,pageSize,preview]);if(signature===lastRender){filter();return}lastRender=signature;document.querySelectorAll('details[data-key]').forEach(d=>folds.set(d.dataset.key,d.open));document.querySelectorAll('[data-scroll-key]').forEach(e=>scrolls.set(e.dataset.scrollKey,[e.scrollLeft,e.scrollTop]));const scroll=window.scrollY;$('#heading').textContent=tabs[tab];$('#nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}">${v}</button>`).join('')+`<small>方向轮 ${state.outer_round??0} · 构思轮 ${state.cycle??0}</small>`;
let html='';if(tab==='overview'){html=`<div class="grid">${[['任务',Object.keys(state.tasks||{}).length],['主张版本',Object.keys(state.claims||{}).length],['证据',Object.keys(state.evidence||{}).length],['实验记录',Object.keys(state.runs||{}).length]].map(([k,v])=>card(k,`<div class="number">${v}</div>`)).join('')}</div>`+card('当前进展',json({phase:label(state.phase),status:label(state.status),reason:state.reason||'',budget:state.budget||state.usage||{},checkpoints:state.checkpoints||{}}))+card('研究范围',json(state.knowledge?.scope||{},'scope'));}
if(tab==='pool')html=pool.map((p,i)=>card(label(p.stage),json(p.output,'pool.'+p.task_id),`${esc(p.subject||p.role)} · ${fmt(p.timestamp)}`,i)).join('');
if(tab==='tasks'){html=objects(state.tasks,'task',(id,t)=>card(id,`<button data-task="${esc(id)}">${selectedTask===id?'收起详情':'查看输入、输出与过程'}</button>${selectedTask===id&&detail?`<details data-key="request-${esc(id)}"><summary>输入与技能</summary>${json(detail.request,'request.'+id)}</details><details open data-key="response-${esc(id)}"><summary>输出</summary>${json(detail.response,'response.'+id)}</details>${(detail.attempts||[]).map(transcript).join('')}`:''}`,`${pill(t.status)} ${esc(label(t.stage))} · ${esc(t.subject||t.role||'')} · ${fmt(t.completed_at||t.started_at)}`,id));}
if(tab==='claims'){const claims=state.claims||{};html=card('主张谱系',graph(Object.entries(claims).map(([id,c])=>({id,title:id})),Object.entries(claims).flatMap(([id,c])=>(c.parents||[]).map(p=>[p,id]))));html+=objects(claims,'claim',(id,c)=>card(id,json(c,'claim.'+id),`${pill(c.verdict)} ${pill(c.stage)} ${esc(c.owner)}`,id));}
if(tab==='evidence')html=objects(state.evidence,'evidence',(id,e)=>card(id,json(e,'evidence.'+id),`${pill(e.kind)} ${esc(e.claim_ref)}`,id));
if(tab==='runs')html=objects(state.runs,'run',(id,r)=>card(id,json(r,'run.'+id),`${pill(r.outcome)} ${pill(r.split)} · seed ${esc(r.seed)} · ${esc(r.claim_ref)}`,id));
if(tab==='draft'){html=card('写作提纲、草稿与冻结记录',json({outline:state.outline||{},draft:state.draft||{},compilation:state.compilation||{},frozen:state.frozen||{}},'paper'));if(state.draft?.main)html+=`<button data-file="${esc(state.draft.main)}">查看 LaTeX 主文件</button>`;}
if(tab==='experts')html=(state.experts||[]).map(e=>card(e.expert_id,json(e,'expert.'+e.expert_id),pill(e.role))).join('');
if(tab==='domain'){const d=state.knowledge?.domain||{};const routes=d.routes||d.problem_coverage||d.open_questions||[];html=card('问题与方法路线',Array.isArray(routes)?graph(routes.map((r,i)=>({id:String(i),title:r.question||r.name||r.route||String(r)})),[]):'')+card('领域全景',json(d,'domain'))+card('文献与阅读覆盖',json({papers:state.knowledge?.corpus?.papers||[],readings:state.knowledge?.readings||{}},'literature'));}
if(tab==='errors')html=errors.map((e,i)=>`<article class="card error">${json(e,'error.'+i)}</article>`).join('');
if(tab==='events')html=events.slice().reverse().map((e,i)=>`<article class="card"><div class="event"><span>${fmt(e.timestamp||e.time||e.at)}</span><div><strong>${esc(e.kind||e.event)}</strong>${json(e,'event.'+i)}</div></div></article>`).join('');
if(preview?.tab===tab)html+=card(preview.path,`<pre data-scroll-key="preview-${esc(preview.path)}">${esc(preview.text)}</pre>`);$('#content').innerHTML=html||'<div class="empty">尚无记录</div>';document.querySelectorAll('details[data-key]').forEach(d=>{if(folds.has(d.dataset.key))d.open=folds.get(d.dataset.key)});document.querySelectorAll('[data-scroll-key]').forEach(e=>{const p=scrolls.get(e.dataset.scrollKey);if(p){e.scrollLeft=p[0];e.scrollTop=p[1]}});window.scrollTo(0,scroll);filter();}
function filter(){const q=$('#query').value.toLowerCase();document.querySelectorAll('#content .card').forEach(c=>c.hidden=q&&!c.textContent.toLowerCase().includes(q))}
async function refresh(){if(busy)return;busy=true;try{const inventory=await api('runs');if(!inventory.runs.length){$('#status').textContent='尚无新版运行';$('#content').innerHTML='<div class="empty">创建并启动一个新版研究运行后，这里会显示完整过程。</div>';return}if(!inventory.runs.some(r=>r.run_id===runId)){runId=inventory.active&&inventory.runs.some(r=>r.run_id===inventory.active)?inventory.active:inventory.runs[0].run_id}$('#runSelect').innerHTML=inventory.runs.map(r=>`<option value="${esc(r.run_id)}" ${r.run_id===runId?'selected':''}>${esc(r.run_id)}</option>`).join('');state=await api('state');[pool,events,errors]=await Promise.all([api('pool'),api('events'),api('errors')]);if(selectedTask&&state.tasks?.[selectedTask])detail=await api('task',{id:selectedTask});$('#status').textContent=label(state.status)+' · '+label(state.phase);$('#notice').textContent='';render();}catch(e){$('#notice').textContent='读取失败：'+e.message;$('#notice').className='card error'}finally{busy=false}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;localStorage.setItem('pa-tab',tab);render()}if(b.dataset.task){selectedTask=selectedTask===b.dataset.task?'':b.dataset.task;detail=selectedTask?await api('task',{id:selectedTask}):null;render()}if(b.dataset.action==='more'){pageSize+=300;render()}if(b.dataset.file){const file=await api('file',{path:b.dataset.file});preview={...file,tab};render();}});
$('#query').addEventListener('input',filter);$('#runSelect').addEventListener('change',()=>{runId=$('#runSelect').value;localStorage.setItem('pa-run',runId);selectedTask='';detail=null;preview=null;folds.clear();scrolls.clear();lastRender='';refresh()});setInterval(()=>{if($('#live').checked)refresh()},4000);refresh();
</script></html>
